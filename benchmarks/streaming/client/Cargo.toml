[package]
name = "wsb-client"
version = "0.1.0"
edition = "2021"
publish = false

# A standalone workspace. The client has no dependency on the code under test, so
# one client binary serves every server build.
[workspace]

[dependencies]
bytes = "1"
futures-util = "0.3"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
debug = "line-tables-only"
strip = false
